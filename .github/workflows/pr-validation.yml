name: AI PR Validation

on:
  pull_request:
    branches: [ main, master, development ]
    types: [ opened, synchronize, reopened ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Setup and Run AI Governance
        env:
          MY_TOKEN: ${{ secrets.AGENTIC_AI_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          echo "🚀 Initializing AI Governance Agent..."
          
          # 1. Clone CLI to a safe place outside the project workspace
          CLI_PATH="$HOME/agentic-ai-cli-tool"
          rm -rf $CLI_PATH
          # Cloning the default branch of the tool
          git clone https://x-access-token:${MY_TOKEN}@github.com/fxbytesin/AgenticAi.git $CLI_PATH
          
          echo "--- CLI Directory Contents (Recursive) ---"
          ls -R $CLI_PATH
          echo "------------------------------------------"

          # 2. Setup and Build CLI in its own directory
          cd $CLI_PATH
          npm install
          npm run build
          
          # 3. Go back to project workspace and run the tool
          cd ${{ github.workspace }}
          echo "🔍 Running validation on: $(pwd)"
          node $CLI_PATH/dist/cli.js validate-pr --pr-number ${{ github.event.pull_request.number }}
