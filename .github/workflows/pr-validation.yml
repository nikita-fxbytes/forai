name: AI PR Validation

on:
  pull_request:
    branches: [ main, master, development ]
    types: [ opened, synchronize, reopened ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Checkout AgenticAi CLI
        uses: actions/checkout@v4
        with:
          repository: fxbytesin/AgenticAi
          path: .agentic-ai-cli
          token: ${{ secrets.AGENTIC_AI_TOKEN }}

      - name: Setup AgenticAi CLI
        run: |
          cd .agentic-ai-cli
          npm install

      - name: Run AI Governance Validation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd .agentic-ai-cli
          npx ts-node src/cli.ts validate-pr --pr-number ${{ github.event.pull_request.number }} --cwd ..
