name: AI PR Validation

on:
  pull_request:
    branches: [ main, master, development ]
    types: [ opened, synchronize, reopened ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Download, Setup and Run AI Governance
        env:
          MY_TOKEN: ${{ secrets.AGENTIC_AI_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Starting AI Governance Flow..."
          
          # 1. Clone CLI
          git clone https://x-access-token:${MY_TOKEN}@github.com/fxbytesin/AgenticAi.git ./cli-tool
          
          # 2. Setup CLI
          cd ./cli-tool
          npm install
          npm run build
          
          # 3. Run Validation on the parent project (the one being tested)
          echo "🔍 Running validation on project root: ${{ github.workspace }}"
          node dist/cli.js validate-pr --pr-number ${{ github.event.pull_request.number }} --cwd ${{ github.workspace }}
