name: AI PR Validation

on:
  pull_request:
    branches: [ main, master, development ]
    types: [ opened, synchronize, reopened ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Checkout AgenticAi CLI
        uses: actions/checkout@v4
        with:
          repository: fxbytesin/AgenticAi
          path: agentic-ai-repo
          token: ${{ secrets.AGENTIC_AI_TOKEN }}

      - name: Verify CLI Checkout
        env:
          MY_TOKEN: ${{ secrets.AGENTIC_AI_TOKEN }}
        run: |
          echo "Current Workspace: ${{ github.workspace }}"
          if [ -z "$MY_TOKEN" ]; then
            echo "❌ AGENTIC_AI_TOKEN is EMPTY. Please check your GitHub Secrets."
          else
            echo "✅ AGENTIC_AI_TOKEN is set."
          fi
          
          echo "--- Root Directory Contents ---"
          ls -F ${{ github.workspace }}
          echo "-------------------------------"
          
          if [ -d "${{ github.workspace }}/agentic-ai-repo" ]; then
            echo "✅ agentic-ai-repo folder exists."
            if [ -f "${{ github.workspace }}/agentic-ai-repo/package.json" ]; then
              echo "✅ CLI package.json found."
            else
              echo "❌ CLI package.json NOT found inside agentic-ai-repo."
            fi
          else
            echo "❌ agentic-ai-repo folder NOT found at ${{ github.workspace }}."
            exit 1
          fi

      - name: Setup AgenticAi CLI
        run: |
          cd ${{ github.workspace }}/agentic-ai-repo
          npm install

      - name: Run AI Governance Validation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run dev --prefix ${{ github.workspace }}/agentic-ai-repo -- validate-pr --pr-number ${{ github.event.pull_request.number }} --cwd ${{ github.workspace }}
