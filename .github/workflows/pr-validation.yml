name: AI PR Validation

on:
  pull_request:
    branches: [ main, master, development ]
    types: [ opened, synchronize, reopened ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Setup and Run AI Governance
        env:
          MY_TOKEN: ${{ secrets.AGENTIC_AI_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Initializing AI Governance Agent..."
          
          # 1. Clone the CLI tool into a temporary folder
          git clone https://x-access-token:${MY_TOKEN}@github.com/fxbytesin/AgenticAi.git ./agentic-ai-helper
          
          # 2. Build and Install it globally in the runner environment
          cd ./agentic-ai-helper
          npm install
          npm run build
          npm install -g .
          
          # 3. Go back to project root and run the validation
          cd ${{ github.workspace }}
          echo "🔍 Running validation on: $(pwd)"
          fxbai-dev validate-pr --pr-number ${{ github.event.pull_request.number }}
